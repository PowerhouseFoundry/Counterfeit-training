<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#35113d">
  <meta name="description" content="Powerhouse educational training app: learn how to check Bank of England polymer notes and complete a visual quiz.">
  <title>Powerhouse | Is This Note Genuine?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="site-shell">
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Powerhouse training home">
      <img src="assets/powerhouse-logo.png" alt="The Powerhouse">
      <span class="brand-copy"><strong>MONEY SKILLS</strong><small>WORKPLACE TRAINING</small></span>

    <div class="header-right">
      <span class="top-training">UK BANKNOTE TRAINING</span>

      <button class="top-icon" data-action="fullscreen" aria-label="Toggle full screen" title="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>

  </header>
  <main id="app" tabindex="-1"></main>

<div id="modal-root"></div>
