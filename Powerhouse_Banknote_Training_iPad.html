/* ---------------------------------------------------------
   POWERHOUSE V2 — IMMERSIVE IPAD TRAINING LAYOUT
   Tablet and desktop views are a single, fixed screen.
   Every lesson, quiz state and result fits inside 100dvh.
   Phones retain their existing scrollable layout.
   --------------------------------------------------------- */
:root{--purple:#33123f;--purple2:#73417f;--lime:#9ad542;--lime-dark:#497f18;--ink:#211627;--shadow:0 18px 50px rgba(38,12,46,.095)}
body{background:radial-gradient(circle at 90% 12%,rgba(158,209,67,.13),transparent 33%),linear-gradient(145deg,#f7f7f5,#ececea)}
.topbar{box-shadow:0 8px 28px rgba(37,10,49,.12);position:relative;z-index:2}
.card{border:1px solid #e8e0ea;box-shadow:0 12px 32px rgba(48,24,55,.065)}
.btn{box-shadow:0 2px 0 rgba(31,9,40,.06);transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#52215f,#35113e)}
.btn-green{background:linear-gradient(135deg,#ace354,#8bcb2c)}
.top-icon{transition:background .2s;backdrop-filter:blur(4px)}
.home-hero{background:radial-gradient(circle at 100% 105%,#72417b 0,transparent 42%),linear-gradient(145deg,#30103c,#552461 92%)}
.home-hero:before{content:"";position:absolute;inset:14px;border:1px solid #ffffff19;border-radius:19px;pointer-events:none}
.home-hero:after{background:#a6d956;opacity:1}
.home-photo{background:radial-gradient(circle at 50% 43%,#fbfdf6,#fff 67%)}
.home-money{background:linear-gradient(160deg,#fff,#f8f6f9);border:1px solid #eee6f0;box-shadow:0 4px 15px rgba(35,18,41,.04)}
.home-money img{filter:drop-shadow(0 8px 12px #2d1b2e20)}
.lesson-media,.quiz-visual{position:relative;overflow:hidden;background:radial-gradient(circle at 86% 14%,#eaf7d7 0,transparent 45%),linear-gradient(150deg,#f0eaf3,#e9ede6)}
.lesson-media:before,.quiz-visual:before{content:"";width:220px;height:220px;border-radius:50%;border:1px solid #763d8520;position:absolute;right:-100px;bottom:-116px;pointer-events:none}
.lesson-media>*,.quiz-visual>*{position:relative;z-index:1}
.media-frame{border-radius:18px;border:1px solid #e9e1ed;box-shadow:0 15px 35px #2a113d16}
.inner-card{border-left-width:4px;box-shadow:0 3px 8px rgba(0,0,0,.015)}
.option{transition:background .12s,border-color .12s,transform .12s}
.option:active:not(:disabled){transform:scale(.993)}
.option.selected{box-shadow:0 0 0 1px #73417f inset}
.option.correct{box-shadow:0 0 0 1px #8dc84b inset}
.lesson-footer{box-shadow:0 3px 12px rgba(24,10,31,.025)}

  html,body{height:100%;height:100dvh;overflow:hidden}
  .site-shell{height:100%;height:100dvh;min-height:0;display:grid;grid-template-rows:74px minmax(0,1fr) 25px}

  {question:'Which portraits can appear on valid current notes?',options:['Only King Charles III','Only Queen Elizabeth II','Neither portrait','King Charles III or Queen Elizabeth II'],correct:3,explain:'Both versions remain in circulation, and both have the same security features.',image:'banknotes'},
  {question:'Which notes also have a second, smaller window?',options:['£20 and £50','£5 and £10','£5 and £20','£10 and £50'],correct:0,explain:'The £20 and £50 notes have a second smaller see-through window.',image:'banknotes'},
  {question:'What appears under a suitable UV lamp?',options:['The whole note glows white','The paper becomes blue','The value shows in bright red and green','The hologram goes black'],correct:2,explain:'The note value glows bright red and green against a duller background under suitable UV light.',image:'uv'},
  {question:'Does a detector pen reliably check UK polymer notes?',options:['Yes, every time','No, it does not reliably detect polymer fakes','Only on £5 notes','Only when the note is new'],correct:1,explain:'The Bank of England says detector pens do not spot counterfeits printed on polymer.',symbol:'search'},
  {question:'Which TWO checks are the most important?',options:['Colour and size','A serial number and date','Smell and thickness','Hologram change and clear window'],correct:3,explain:'The Bank of England highlights the changing hologram and see-through window as the two key checks.',symbol:'eye'},
  {question:'You are unsure about a note at work. What should you do?',options:['Accept it without checking','Tell the customer it is definitely fake','Stop and ask a member of staff','Put it straight back into the till'],correct:2,explain:'Stop, ask a member of staff and follow your workplace procedure. Do not accuse a customer.',symbol:'shield'}
];
function moveTop(){window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true})}
function photo(name,caption='',more='') {return `<figure class="media-frame ${more}"><img src="${A(name)}" alt="Illustration of a UK banknote security feature"><figcaption>${caption || 'Visual guide – use a real note to practise'}</figcaption></figure>`}
function renderHome(){return `<section class="home-layout">
  <div class="home-hero"><span class="eyebrow">POWERHOUSE TRAINING · MONEY SKILLS</span><h1>IS THIS NOTE <span class="green-word">GENUINE?</span></h1><p class="hero-sub">A visual, step-by-step guide to checking UK banknotes at work.</p>
  <div class="split-row"><button data-action="start" class="btn btn-green">${ico('play')} Start training ${ico('arrow')}</button><button data-action="quiz-start" class="btn btn-outline">${ico('checklist')} Go to quiz</button></div>
  <div class="hero-chips"><span>${ico('eye')} LOOK</span><span>${ico('tilt')} TILT</span><span>${ico('hand')} FEEL</span><span>${ico('search')} CHECK</span></div></div>
  <div class="home-side"><div class="home-photo card"><span class="photolabel">UK POLYMER BANKNOTES</span><div class="money-home-grid">${[['note5','£5'],['note10','£10'],['note20','£20'],['note50','£50']].map(([im,value])=>`<div class="home-money"><img src="${A(im)}" alt="${value} note training illustration"><strong>${value}</strong></div>`).join('')}</div></div>
  <div class="home-info card"><div class="round-icon">${ico('shield')}</div><div><h3>Training for real work</h3><p>Short visual slides, tap-to-try activities and 10 quiz questions. No sign-in needed.</p></div></div></div>
</section>`}
function progress(kind,which,total){return `<div class="progress-layout"><span class="progress-text">${kind} ${String(which).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span><div class="progress-track" aria-label="Progress"><div class="progress-fill" style="width:${100*which/total}%"></div></div></div>`}
function lessonContent(i){
  switch(i){
  case 0:return {body:`<div class="feature-list"><div class="feature">${ico('eye')} LOOK at the window</div><div class="feature">${ico('tilt')} TILT to see the change</div><div class="feature">${ico('hand')} FEEL the printing</div><div class="feature">${ico('search')} CHECK the details</div></div><div class="inner-card green"><strong>Learn. Try. Check.</strong><p>Then complete the short quiz.</p></div>`,media:`<div class="money-four">${[['note5','£5'],['note10','£10'],['note20','£20'],['note50','£50']].map(x=>`<div class="money-mini"><img src="${A(x[0])}" alt="${x[1]} Bank of England note illustration"><strong>${x[1]}</strong></div>`).join('')}</div>`};
  case 1:return {body:`<div class="inner-card green"><strong>What am I looking for?</strong><p>Look for the monarch’s portrait and the note value around the clear window.</p></div><button class="btn btn-soft btn-small" data-action="reveal">${ico('eye')} ${state.reveal?'Hide extra tip':'Show extra tip'}</button>${state.reveal?'<div class="inner-card"><strong>Extra tip</strong><p>The portrait may show King Charles III or Queen Elizabeth II.</p></div>':''}`,media:photo('window','LOOK · Clearly defined portrait in the see-through window')};
  case 2:return {body:`<div class="inner-card green"><strong>Try it yourself</strong><p>Press the button to switch between the two views of the hologram.</p></div><p class="safe-text">On a £10 note, look for “Ten” and “Pounds”.</p>`,media:`<div class="tilt-experiment"><div class="tilt-image ${state.tilt?'tilted':''}"><img src="${A(state.tilt?'tilt-pounds':'tilt-ten')}" alt="Hologram showing ${state.tilt?'Pounds':'Ten'}"></div><div class="tilt-label" aria-live="polite">${state.tilt?'POUNDS':'TEN'}</div><button class="btn btn-green" data-action="tilt">${ico('tilt')} Tilt the note</button></div>`};
  case 3:return {body:`<div class="feature-list"><div class="feature">${ico('check')} Feel the words “Bank of England”.</div><div class="feature">${ico('check')} Feel near the value in the bottom-right corner.</div></div><div class="inner-card"><strong>Remember</strong><p>Polymer notes are made from thin, flexible plastic.</p></div>`,media:photo('raised','FEEL · Raised print on a polymer banknote')};
  case 4:return {body:`<div class="feature-list"><div class="feature">${ico('check')} Clear, detailed lines</div><div class="feature">${ico('check')} No blurred edges</div><div class="feature">${ico('check')} No smudged printing</div></div>`,media:photo('detail','CHECK · Detailed printing on a banknote')};
  case 5:return {body:`<div class="inner-card green"><strong>With a suitable UV lamp</strong><p>The note value appears in bright red and green.</p></div><div class="inner-card"><strong>Good to know</strong><p>A UV lamp is an extra check. The two main checks are the clear window and changing hologram.</p></div>`,media:photo('uv','UV · Bright red and green note value')};
  case 6:return {body:`<div class="feature-list"><div class="feature">${ico('banknote')} £5 and £10: main window</div><div class="feature">${ico('banknote')} £20 and £50: main window + smaller window</div></div><div class="inner-card green"><strong>Both portraits are valid</strong><p>King Charles III and Queen Elizabeth II notes are both in circulation.</p></div>`,media:`<div class="money-four">${[['note5','£5'],['note10','£10'],['note20','£20'],['note50','£50']].map(x=>`<div class="money-mini"><img src="${A(x[0])}" alt="${x[1]} training banknote illustration"><strong>${x[1]}</strong></div>`).join('')}</div>`};
  case 7:return {body:`<div class="safe-panel">${ico('shield')}<div><strong>STOP AND ASK STAFF</strong><p>Follow the workplace procedure if you suspect a counterfeit.</p></div></div><div class="feature-list"><div class="feature">${ico('check')} Stay calm.</div><div class="feature">${ico('check')} Do not accuse anyone.</div><div class="feature">${ico('check')} Get support from staff.</div></div>`,media:`<div class="step-flow"><div class="stepbox">${ico('stop')}<b>STOP</b><span>Do not guess</span></div><div class="stepbox">${ico('people')}<b>ASK</b><span>Speak to staff</span></div><div class="stepbox">${ico('checklist')}<b>FOLLOW</b><span>Workplace rules</span></div><div class="stepbox">${ico('shield')}<b>STAY SAFE</b><span>Remain polite</span></div></div>`};
  case 8:return {body:`<div class="inner-card green"><strong>Practise with a real banknote</strong><p>Tap a box each time you complete the check.</p></div><p class="subtext">${state.practice.size===4?'Well done. You have practised all four checks!':'Take your time. Ask staff for support if needed.'}</p>`,media:`<div><div class="practice-grid">${[['look','eye','LOOK'],['tilt','tilt','TILT'],['feel','hand','FEEL'],['check','search','CHECK']].map(([key,sym,lab])=>`<button class="practice-tile ${state.practice.has(key)?'is-done':''}" data-action="practice" data-value="${key}" aria-pressed="${state.practice.has(key)}">${ico(state.practice.has(key)?'check':sym)}<span>${lab}</span></button>`).join('')}</div><div class="practice-count">${state.practice.size} of 4 checks practised</div></div>`};
  default:return {body:'',media:''};
  }
}
function renderLesson(){const i=state.slide;const s=slides[i];const c=lessonContent(i);return `<section class="lesson-wrap"><div class="section-top"><span class="eyebrow">INTERACTIVE TRAINING</span>${progress('SLIDE',i+1,slides.length)}</div><article class="lesson-card card"><div class="lesson-copy"><span class="eyebrow">${s.eyebrow}</span><h2>${s.title}</h2><p class="subtext">${s.intro}</p>${c.body}</div><div class="lesson-media">${c.media}</div></article>
  <div class="lesson-footer"><div class="left-actions"><button class="btn btn-soft" data-action="lesson-back">${ico('back')} ${i?'Back':'Home'}</button><button class="btn btn-outline btn-small" data-action="speak">${ico('speaker')} Read aloud</button></div><div class="right-actions"><button class="btn ${i===slides.length-1?'btn-green':'btn-primary'}" data-action="lesson-next">${i===slides.length-1?'Start the quiz':'Next slide'} ${ico('arrow')}</button></div></div></section>`}
function renderQuiz(){const q=quiz[state.quiz];const feedback=state.locked?`<div class="feedback ${state.selected===q.correct?'':'error'}" role="status" aria-live="polite"><strong>${state.selected===q.correct?'Well done — correct!':'Good try — keep learning!'}</strong><p>${q.explain}</p></div>`:'';
 const media=q.image?photo(q.image,'Training image: choose the best answer'):`<div class="quiz-icon-scene"><div class="circle-giant">${ico(q.symbol||'shield')}</div><p>WORKPLACE MONEY SKILLS</p></div>`;
 return `<section class="quiz-shell"><div class="section-top"><span class="eyebrow">KNOWLEDGE CHECK</span>${progress('QUESTION',state.quiz+1,quiz.length)}</div><article class="quiz-card card"><div class="quiz-visual">${media}</div><div class="quiz-content"><span class="eyebrow">QUESTION ${state.quiz+1} OF ${quiz.length}</span><h2>${q.question}</h2><div class="quiz-options" role="group" aria-label="Choose an answer">${q.options.map((o,i)=>`<button class="option ${state.locked?(i===q.correct?'correct':i===state.selected?'wrong':''):(i===state.selected?'selected':'')}" data-action="answer" data-value="${i}" ${state.locked?'disabled':''} aria-pressed="${i===state.selected}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div>${feedback}<div class="quiz-actions"><button class="btn btn-soft btn-small" data-action="quiz-quit">${ico('back')} Leave quiz</button>${state.locked?`<button class="btn btn-primary" data-action="quiz-next">${state.quiz===quiz.length-1?'See my result':'Next question'} ${ico('arrow')}</button>`:`<button class="btn btn-green" data-action="quiz-check" ${state.selected===null?'disabled':''}>${ico('check')} Check answer</button>`}</div></div></article></section>`}
function renderResults(){const score=state.score;const perfect=score===quiz.length;const strong=score>=8;let heading=perfect?'Excellent checking!':strong?'Great work!':score>=5?'Good progress!':'Keep practising!';let detail=strong?'You know many of the important security checks. Keep practising with real notes and staff support.':'The more you practise the checks, the easier they become. Review the slides, then have another try.';
 return `<section class="results card"><div class="result-icon">${ico(strong?'award':'checklist')}</div><span class="eyebrow">TRAINING QUIZ COMPLETE</span><h2>${heading}</h2><div class="result-score">${score} <span style="font-size:.45em;color:#827489">/ ${quiz.length}</span></div><p>${detail}</p><div class="inner-card green"><strong>Remember the four checks</strong><p>LOOK at the window · TILT the hologram · FEEL raised print · CHECK the details.</p></div><div class="split-row" style="justify-content:center"><button class="btn btn-primary" data-action="start">${ico('back')} Review training</button><button class="btn btn-green" data-action="quiz-start">${ico('rotate')} Try quiz again</button></div><p class="safe-text" style="margin:20px 0 0;font-size:13px">This is a practice quiz, not a certification of counterfeit-detection ability.</p></section>`}
function render(){if(state.view==='lesson')app.innerHTML=renderLesson();else if(state.view==='quiz')app.innerHTML=renderQuiz();else if(state.view==='results')app.innerHTML=renderResults();else app.innerHTML=renderHome()}
function home(){window.speechSynthesis?.cancel?.();state.view='home';render();moveTop()}
function startLesson(){state.view='lesson';state.slide=0;state.reveal=false;state.tilt=false;state.practice=new Set();render();moveTop()}
function startQuiz(){state.view='quiz';state.quiz=0;state.selected=null;state.locked=false;state.score=0;state.answers=[];render();moveTop()}
function goSlide(next){if(next<0){home();return}if(next>=slides.length){startQuiz();return}state.slide=next;state.reveal=false;state.tilt=false;render();moveTop()}
function announce(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(slides[state.slide].tts);utterance.lang='en-GB';utterance.rate=.85;utterance.pitch=1;const voice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='en-gb');if(voice)utterance.voice=voice;window.speechSynthesis.speak(utterance)}
function poster(){modalRoot.innerHTML=`<div class="overlay" data-action="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Powerhouse training poster"><div class="modal-top"><h2>Banknote checking poster</h2><button class="modal-close" data-action="close" aria-label="Close poster">${ico('back')}</button></div><img src="${A('original-poster')}" alt="Powerhouse reference poster showing UK banknote security checks: look, tilt, feel, check"><div class="modal-bottom"><a class="source-link" href="https://www.bankofengland.co.uk/banknotes/counterfeit-banknotes/how-to-check-your-banknotes" target="_blank" rel="noopener noreferrer">Official Bank of England checking guide</a><button class="btn btn-small btn-soft" data-action="print">Print poster</button></div></div></div>`;const close=modalRoot.querySelector('.modal-close');close?.focus()}
document.addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;switch(action){
 case 'home':home();break;case 'start':startLesson();break;case 'quiz-start':startQuiz();break;
 case 'lesson-next':goSlide(state.slide+1);break;case 'lesson-back':goSlide(state.slide-1);break;
 case 'reveal':state.reveal=!state.reveal;render();break;case 'tilt':state.tilt=!state.tilt;render();break;
 case 'practice':{const v=btn.dataset.value;if(state.practice.has(v))state.practice.delete(v);else state.practice.add(v);render();break}
 case 'speak':announce();break;
 case 'answer':if(state.locked)return;state.selected=Number(btn.dataset.value);render();break;
 case 'quiz-check':{if(state.selected===null||state.locked)return;state.locked=true;const correct=state.selected===quiz[state.quiz].correct;if(correct)state.score++;state.answers.push({index:state.quiz,selection:state.selected,correct});render();break}
 case 'quiz-next':if(state.quiz===quiz.length-1){state.view='results';render();moveTop()}else{state.quiz++;state.selected=null;state.locked=false;render();moveTop()}break;
 case 'quiz-quit':home();break;case 'poster':poster();break;
 case 'close':modalRoot.innerHTML='';break;
 case 'close-overlay':if(event.target.classList.contains('overlay'))modalRoot.innerHTML='';break;
 case 'print':window.print();break;
 case 'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{});break;
 }});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modalRoot.innerHTML){modalRoot.innerHTML='';return}if(state.view==='lesson'&&event.target.tagName!=='BUTTON'&&event.key==='ArrowRight'){goSlide(state.slide+1)}else if(state.view==='lesson'&&event.target.tagName!=='BUTTON'&&event.key==='ArrowLeft'){goSlide(state.slide-1)}});
render();
</script>
</body>
</html>
